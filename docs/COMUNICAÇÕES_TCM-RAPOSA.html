<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoramento - TCM-RAPOSA</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #2563eb; --primary-dark: #1e40af; --secondary: #64748b;
        --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; --text-light: #6b7280;
        --border: #e5e7eb; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    [data-theme="dark"] {
        --primary: #3b82f6; --primary-dark: #60a5fa; --secondary: #94a3b8;
        --bg: #0f172a; --card-bg: #1e293b; --text: #f3f4f6; --text-light: #9ca3af;
        --border: #334155;
    }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; transition: 0.3s; }
    .container { max-width: 1440px; margin: 0 auto; padding: 0 20px; }
    .header-wrapper { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
    .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 25px 0; }
    .kpi-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; }
    .kpi-title { font-size: 0.875rem; color: var(--text-light); font-weight: 600; text-transform: uppercase; }
    .kpi-value { font-size: 2rem; font-weight: 700; margin-top: 5px; color: var(--text); }
    .kpi-sub { font-size: 0.85rem; margin-top: auto; padding-top: 10px; }
    
    .controls-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .search-input { flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-export { background: var(--success); color: white; }

    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .chart-box { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); height: 320px; }

    .tabs-nav { display: flex; gap: 5px; margin-bottom: 20px; background: var(--card-bg); padding: 5px; border-radius: 10px; border: 1px solid var(--border); width: fit-content; }
    .tab-item { padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-light); transition: 0.2s; user-select: none; }
    .tab-item.active { background: var(--primary); color: white; }
    .tab-item.active.tab-crit { background: var(--danger); }
    
    .view-section { display: none; animation: fadeIn 0.4s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .vehicle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .v-card { background: var(--card-bg); border-radius: 10px; padding: 15px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
    .v-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-color: var(--primary); }
    .v-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: var(--success); }
    .v-card.outdated::after { background: var(--warning); }
    .v-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
    .v-id { font-size: 1.5rem; font-weight: 700; color: var(--text); line-height: 1; }
    .v-meta { font-size: 0.75rem; color: var(--text-light); background: var(--bg); padding: 4px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; }
    .v-ip { font-size: 0.75rem; font-weight: bold; color: var(--primary); background: rgba(37,99,235,0.1); padding: 4px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; }
    
    .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); }
    table { width: 100%; border-collapse: collapse; min-width: 600px; text-align: left; }
    th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { background: var(--bg); font-weight: 600; color: var(--text-light); text-transform: uppercase; cursor: pointer; }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-offline { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
    .badge-error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
    
    /* Modal Styles */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    .modal-content { background-color: var(--card-bg); margin: 5vh auto; padding: 0; border-radius: 16px; width: 90%; max-width: 700px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: slideIn 0.3s; display: flex; flex-direction: column; max-height: 90vh; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { padding: 20px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px 25px; overflow-y: auto; flex: 1; }
    .close-modal { font-size: 1.5rem; cursor: pointer; color: var(--text-light); }
    
    /* Modal Sub-tabs */
    .m-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid var(--bg); }
    .m-tab { background: none; border: none; padding: 10px 15px; font-weight: 600; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.2s; }
    .m-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .m-content { display: none; }
    .m-content.active { display: block; animation: fadeIn 0.3s ease; }
    
    #refresh-bar { height: 3px; background: var(--primary); width: 100%; position: absolute; bottom: 0; left: 0; transition: width 1s linear; }
    .hidden { display: none !important; }
    .text-danger { color: var(--danger); }
</style>
</head>
<body>

<header class="header-wrapper">
    <div class="container header-content">
        <div>
            <h1 style="margin:0; font-size: 1.5rem;">📊 TCM-RAPOSA</h1>
            <small style="color: var(--text-light); display: block; margin-top: 5px;">Última atualização: 08:27</small>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="toggleTheme()">🌓 Tema</button>
            <button class="btn btn-export" onclick="exportData()">📥 Exportar</button>
        </div>
        <div id="refresh-bar"></div>
    </div>
</header>

<div class="container">
    <div class="kpi-grid">
        <div class="kpi-card" style="border-left: 5px solid var(--success);">
            <span class="kpi-title">Veículos Online</span>
            <div class="kpi-value" id="kpi-online">0</div>
        </div>
        <div class="kpi-card" style="border-left: 5px solid var(--danger);">
            <span class="kpi-title">Críticos / Erros</span>
            <div class="kpi-value" id="kpi-critical">0</div>
        </div>
        <div class="kpi-card" style="border-left: 5px solid var(--warning);">
            <span class="kpi-title">Offline</span>
            <div class="kpi-value" id="kpi-offline">0</div>
        </div>
        <div class="kpi-card" style="border-left: 5px solid var(--primary);">
            <span class="kpi-title">Taxa de Sucesso</span>
            <div class="kpi-value" id="kpi-rate">0%</div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-box">
            <h3 style="margin-top:0; color:var(--text-light); font-size:1rem;">Tendência (30 Dias)</h3>
            <div style="height: 250px;"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="chart-box">
            <h3 style="margin-top:0; color:var(--text-light); font-size:1rem;">Distribuição Atual</h3>
            <div style="height: 250px; position: relative;"><canvas id="statusChart"></canvas></div>
        </div>
    </div>

    <div class="controls-bar">
        <input type="text" id="globalSearch" class="search-input" placeholder="🔍 Buscar por prefixo, erro ou versão...">
        <select id="metaFilter" class="search-input" style="max-width: 200px;">
            <option value="all">Todos os Filtros</option>
            <option value="old_eod">EOD Desatualizado</option>
            <option value="has_error">Com Erro</option>
        </select>
        <input type="date" id="datePicker" class="search-input" value="2026-10-09" style="max-width: 160px;">
    </div>

    <div class="tabs-nav">
        <div class="tab-item active" onclick="switchTab('tab-online')">✅ Online</div>
        <div class="tab-item tab-crit" onclick="switchTab('tab-critical')">🚨 Erros</div>
        <div class="tab-item" onclick="switchTab('tab-offline')">⚠️ Offline</div>
    </div>

    <div id="tab-online" class="view-section active">
        <div class="vehicle-grid" id="list-online"></div>
    </div>

    <div id="tab-critical" class="view-section">
        <div class="table-container">
            <table>
                <thead>
                    <tr><th onclick="sortTable(0, 'list-critical')">Prefixo</th><th>IP</th><th>Status</th><th>Erro Reportado</th><th>Hora</th><th>Versão</th></tr>
                </thead>
                <tbody id="list-critical"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-offline" class="view-section">
        <div class="table-container">
            <table>
                <thead>
                    <tr><th onclick="sortTable(0, 'list-offline')">Prefixo</th><th>IP</th><th>Status</th><th>Última Comunicação</th><th>Tempo Inativo</th></tr>
                </thead>
                <tbody id="list-offline"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODAL COM ABAS DE DETALHES -->
<div id="modalInfo" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="m-title" style="margin:0">Detalhes</h2>
            <span class="close-modal" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div id="m-body-header"></div>
            
            <div class="m-tabs">
                <button class="m-tab active" onclick="switchModalTab('m-comms', this)">Últimas 50 Comunicações</button>
                <button class="m-tab" onclick="switchModalTab('m-tgs', this)">Últimos 30 TGs (Seq)</button>
            </div>
            
            <div id="m-comms" class="m-content active"></div>
            <div id="m-tgs" class="m-content"></div>
        </div>
    </div>
</div>

    const datePicker = document.getElementById('datePicker');
    const searchInput = document.getElementById('globalSearch');
    const metaFilter = document.getElementById('metaFilter');
    let chartTrend = null; let chartStatus = null;
    
    let timeLeft = 300;
    setInterval(() => {
        timeLeft--;
        if(timeLeft <= 0) location.reload();
        document.getElementById('refresh-bar').style.width = ((300 - timeLeft) / 300 * 100) + '%';
    }, 1000);

    function init() {
        datePicker.addEventListener('change', renderDashboard);
        searchInput.addEventListener('keyup', applyFilters);
        metaFilter.addEventListener('change', applyFilters);
        renderDashboard();
    }

    function toggleTheme() {
        const body = document.body;
        body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        renderCharts(datePicker.value, lastCounts);
    }

    function switchTab(id) {
        document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tabs-nav .tab-item').forEach(e => e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const index = id === 'tab-online' ? 0 : id === 'tab-critical' ? 1 : 2;
        document.querySelectorAll('.tabs-nav .tab-item')[index].classList.add('active');
    }

    function switchModalTab(id, el) {
        document.querySelectorAll('.m-content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.m-tab').forEach(e => e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    let lastCounts = { online: 0, offline: 0, critical: 0, total: 0 };

    function renderDashboard() {
        const selectedDateStr = datePicker.value;
        const lists = { online: document.getElementById('list-online'), offline: document.getElementById('list-offline'), critical: document.getElementById('list-critical') };
        Object.values(lists).forEach(l => l.innerHTML = '');

        let counts = { online: 0, offline: 0, critical: 0, total: 0 };
        const selParts = selectedDateStr.split('-');
        const dateEndObj = new Date(parseInt(selParts[0]), parseInt(selParts[1])-1, parseInt(selParts[2]), 23, 59, 59);
        const dateStartObj = new Date(parseInt(selParts[0]), parseInt(selParts[1])-1, parseInt(selParts[2]), 0, 0, 0);

        // Ordena veículos por número
        FROTA.sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));

        FROTA.forEach(veiculo => {
            counts.total++;
            const logs = HISTORY[veiculo] || [];
            let lastLog = null;
            for (let log of logs) { 
                const logDate = new Date(log.d.replace(' ', 'T'));
                if (logDate <= dateEndObj) { lastLog = log; break; } 
            }

            const meta = METADATA[veiculo] || {};
            const ipStr = IPS[veiculo] || 'N/A';
            const eodVal = parseFloat(meta.eod) || 0;
            const isOutdated = eodVal < 239.0;
            
            const searchData = `${veiculo} ${meta.versao} ${meta.eod} ${ipStr} ${lastLog ? lastLog.e : ''}`.toLowerCase();
            const rowAttr = `data-search="${searchData}" data-outdated="${isOutdated}" data-error="${lastLog && lastLog.e ? 'true' : 'false'}"`;

            if (!lastLog) {
                counts.offline++;
                lists.offline.insertAdjacentHTML('beforeend', `<tr ${rowAttr}><td><strong>${veiculo}</strong></td><td>${ipStr}</td><td><span class="badge badge-offline">SEM DADOS</span></td><td>Nunca</td><td>-</td></tr>`);
                return;
            }

            const lastDate = new Date(lastLog.d.replace(' ', 'T'));
            const isToday = (lastDate >= dateStartObj && lastDate <= dateEndObj);

            if (isToday) {
                if (lastLog.e) {
                    counts.critical++;
                    lists.critical.insertAdjacentHTML('beforeend', `<tr ${rowAttr} onclick="showDetails('${veiculo}')" style="cursor:pointer">
                        <td><strong>${veiculo}</strong></td><td>${ipStr}</td><td><span class="badge badge-error">ERRO</span></td><td class="text-danger">${escapeHtml(lastLog.e)}</td><td>${lastLog.d.split(' ')[1]}</td><td><small>${meta.versao || '-'}</small></td>
                    </tr>`);
                } else {
                    counts.online++;
                    lists.online.insertAdjacentHTML('beforeend', `
                    <div class="v-card ${isOutdated ? 'outdated' : ''}" ${rowAttr} onclick="showDetails('${veiculo}')">
                        <div class="v-header"><span class="v-id">${veiculo}</span><span style="color:var(--success)">●</span></div>
                        <div class="v-time">🕒 ${lastLog.d.split(' ')[1]}</div>
                        <div class="v-meta">v${meta.versao || '?'} | EOD ${meta.eod || '?'}</div>
                        <div class="v-ip">IP: ${ipStr}</div>
                    </div>`);
                }
            } else {
                counts.offline++;
                const diffDays = Math.round(Math.abs((dateStartObj - lastDate) / 86400000));
                lists.offline.insertAdjacentHTML('beforeend', `<tr ${rowAttr} onclick="showDetails('${veiculo}')" style="cursor:pointer">
                    <td><strong>${veiculo}</strong></td><td>${ipStr}</td><td><span class="badge badge-offline">OFFLINE</span></td><td>${formatDateBr(lastLog.d)}</td><td>${diffDays} dia(s)</td>
                </tr>`);
            }
        });

        lastCounts = counts;
        document.getElementById('kpi-online').innerText = counts.online;
        document.getElementById('kpi-offline').innerText = counts.offline;
        document.getElementById('kpi-critical').innerText = counts.critical;
        const active = counts.online + counts.critical;
        document.getElementById('kpi-rate').innerText = active > 0 ? ((counts.online / active) * 100).toFixed(1) + '%' : '0%';

        applyFilters(); 
        renderCharts(selectedDateStr, counts);
    }

    function applyFilters() {
        const term = searchInput.value.toLowerCase();
        const filterType = metaFilter.value;
        const filterItem = (el) => {
            let show = true;
            if (term && el.getAttribute('data-search').indexOf(term) === -1) show = false;
            if (filterType === 'old_eod' && el.getAttribute('data-outdated') !== 'true') show = false;
            if (filterType === 'has_error' && el.getAttribute('data-error') !== 'true') show = false;
            el.style.display = show ? '' : 'none';
        };
        document.querySelectorAll('.v-card, tbody tr').forEach(filterItem);
    }

    function renderCharts(dateStr, counts) {
        const textColor = document.body.getAttribute('data-theme') === 'dark' ? '#cbd5e1' : '#334155';
        if(chartStatus) chartStatus.destroy();
        chartStatus = new Chart(document.getElementById('statusChart'), {
            type: 'doughnut', data: { labels: ['Online', 'Erro', 'Offline'], datasets: [{ data: [counts.online, counts.critical, counts.offline], backgroundColor: ['#10b981', '#ef4444', '#f59e0b'], borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: textColor } } } }
        });

        const labels = []; const dOn = []; const dErr = [];
        let baseDate = new Date();
        for(let i = 29; i >= 0; i--) {
            let d = new Date(baseDate); d.setDate(d.getDate() - i);
            let iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            labels.push(`${iso.split('-')[2]}/${iso.split('-')[1]}`);
            let on = 0, err = 0;
            FROTA.forEach(v => { const log = (HISTORY[v] || []).find(l => l.d.startsWith(iso)); if(log) { if(log.e) err++; else on++; } });
            dOn.push(on); dErr.push(err);
        }
        if(chartTrend) chartTrend.destroy();
        chartTrend = new Chart(document.getElementById('trendChart'), {
            type: 'line', data: { labels: labels, datasets: [ { label: 'Sucesso', data: dOn, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, pointRadius: 1 }, { label: 'Erros', data: dErr, borderColor: '#ef4444', backgroundColor: 'transparent', pointRadius: 1 } ] },
            options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { y: { grid: { color: 'rgba(100,100,100,0.2)' }, ticks: { color: textColor } }, x: { grid: { display: false }, ticks: { color: textColor } } } }
        });
    }

    function showDetails(veiculo) {
        const meta = METADATA[veiculo] || {};
        const ipStr = IPS[veiculo] || 'N/A';
        const comms = COMMS_50[veiculo] || [];
        const tgs = TGS_30[veiculo] || [];

        document.getElementById('m-title').innerHTML = `Veículo <strong>${escapeHtml(veiculo)}</strong>`;
        
        document.getElementById('m-body-header').innerHTML = `
            <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
                <div style="flex:1; min-width:120px; background:var(--bg); padding:10px; border-radius:8px;">
                    <div style="font-size:0.75rem; color:var(--text-light);">Endereço IP</div>
                    <div style="font-weight:bold; color:var(--primary);">${escapeHtml(ipStr)}</div>

                <div style="flex:1; min-width:120px; background:var(--bg); padding:10px; border-radius:8px;">
                    <div style="font-size:0.75rem; color:var(--text-light);">Versão Apl / EOD</div>
                    <div style="font-weight:bold;">${escapeHtml(meta.versao || 'N/A')} / ${escapeHtml(meta.eod || 'N/A')}</div>
                </div>
                <div style="flex:1; min-width:120px; background:var(--bg); padding:10px; border-radius:8px;">
                    <div style="font-size:0.75rem; color:var(--text-light);">Série</div>
                    <div style="font-weight:bold;">${escapeHtml(meta.serie || 'N/A')}</div>
                </div>
            </div>
        `;

        let commsHtml = '<div class="table-container"><table style="width:100%; font-size:0.85rem;">';
        commsHtml += '<tr><th>Data/Hora</th><th>Apl</th><th>EOD</th><th>Status / Erro</th></tr>';
        if (comms.length > 0) {
            comms.forEach(c => {
                let status = c.erro ? `<span class="text-danger">❌ ${escapeHtml(c.erro)}</span>` : '<span style="color:var(--success)">✅ Sucesso</span>';
                commsHtml += `<tr><td>${c.data}</td><td>${c.apl}</td><td>${c.eod}</td><td>${status}</td></tr>`;
            });
        } else {
            commsHtml += '<tr><td colspan="4" style="text-align:center;">Nenhum registro encontrado.</td></tr>';
        }
        commsHtml += '</table></div>';
        document.getElementById('m-comms').innerHTML = commsHtml;

        let tgsHtml = '<div class="table-container"><table style="width:100%; font-size:0.85rem;">';
        tgsHtml += '<tr><th>Data do Arquivo (rDate)</th><th>Sequencial (Seq)</th></tr>';
        if (tgs.length > 0) {
            tgs.forEach(t => {
                tgsHtml += `<tr><td>${t.data}</td><td><span class="badge" style="background:var(--primary); color:white;">${t.seq}</span></td></tr>`;
            });
        } else {
            tgsHtml += '<tr><td colspan="2" style="text-align:center;">Nenhum TG nos últimos 30 dias.</td></tr>';
        }
        tgsHtml += '</table></div>';
        document.getElementById('m-tgs').innerHTML = tgsHtml;

        document.querySelectorAll('.m-tab')[0].click();
        document.getElementById('modalInfo').style.display = "block";
    }

    function closeModal() { document.getElementById('modalInfo').style.display = "none"; }
    window.onclick = function(e) { if(e.target == document.getElementById('modalInfo')) closeModal(); }
    function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : ''; }
    function formatDateBr(isoStr) { return isoStr ? isoStr.split(' ')[0].split('-').reverse().join('/') + ' ' + isoStr.split(' ')[1].substring(0,5) : 'N/A'; }

    function exportData() {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Prefixo;IP;Status;Data;Hora;Erro;Versao;EOD\n";
        
        FROTA.forEach(veiculo => {
            const meta = METADATA[veiculo] || {};
            const ipStr = IPS[veiculo] || 'N/A';
            const logs = HISTORY[veiculo] || [];
            const lastLog = logs[0]; 
            
            let status = "OFFLINE";
            let erro = "";
            let data = "";
            let hora = "";

            if (lastLog) {
                const d = lastLog.d.split(' ');
                data = d[0];
                hora = d[1];
                if (lastLog.e) {
                    status = "ERRO";
                    erro = lastLog.e.replace(/;/g, ",");
                } else {
                    status = "ONLINE";
                }
            }

            csvContent += `${veiculo};${ipStr};${status};${data};${hora};${erro};${meta.versao || ''};${meta.eod || ''}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `relatorio_frota_${datePicker.value}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function sortTable(n, tableId) {
        var table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
        table = document.getElementById(tableId).parentNode; 
        switching = true; dir = "asc"; 
        while (switching) {
            switching = false;
            rows = table.rows;
            for (i = 1; i < (rows.length - 1); i++) {
                shouldSwitch = false;
                x = rows[i].getElementsByTagName("TD")[n]; 
                y = rows[i + 1].getElementsByTagName("TD")[n];
                if (dir == "asc") { 
                    if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) { shouldSwitch = true; break; } 
                } else { 
                    if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) { shouldSwitch = true; break; } 
                }
            }
            if (shouldSwitch) { 
                rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                switching = true; switchcount ++; 
            } else { 
                if (switchcount == 0 && dir == "asc") { dir = "desc"; switching = true; } 
            }
        }
    }

    init();
</script>
